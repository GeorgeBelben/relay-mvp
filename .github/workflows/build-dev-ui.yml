name: Build Dev UI

# Manually-triggered build for on-device testing of the Tauri GUI app (relay-gui), mirroring
# build-dev.yml's relay-cli flow. Produces the .deb + systemd unit + cursor theme as one artifact,
# without cutting a version tag / release.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libudev-dev # relay-core's gilrs dependency needs this (libudev-sys) on Linux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: relay-ui
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: relay-ui
        env:
          # createUpdaterArtifacts (tauri.conf.json) requires signing once a pubkey is configured,
          # even for a non-release build like this one -- see relay-ui's original build-dev.yml.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-gui
          # relay-ui/src-tauri is a member of the root workspace, so Cargo's build output (and
          # Tauri's bundle) lands in the shared top-level target/, not relay-ui/src-tauri/target/.
          path: |
            target/release/bundle/deb/*.deb
            relay-ui/packaging/systemd/relay.service
            relay-ui/packaging/cursor-theme/relay-blank/**
          retention-days: 7
