[package]
name = "relay-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
dirs = "6"
thiserror = "2"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
nix = { version = "0.29", features = ["fs"] }
chacha20poly1305 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
