[package]
name = "relay-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
dirs = "6"
thiserror = "2"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["fs"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
nanoid = "0.5"
regex = "1"
crc32fast = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
toml = "1.1.5"
