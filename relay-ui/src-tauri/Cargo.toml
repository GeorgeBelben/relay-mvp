[package]
name = "relay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Renamed from the package default ("relay") to avoid colliding with relay-cli's
# own binary output, also named "relay", now that both live in one workspace.
name = "relay-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
relay-core = { path = "../../relay-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
# No "macros" feature -- this crate holds a SqlitePool in Tauri state but no longer runs any
# query!/migrate! macros itself (relay-core owns the schema and its own compile-time-checked
# queries now), so no local .sqlx/ cache or DATABASE_URL is needed here.
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tauri = { version = "2", features = ["test"] }
# "macros" only for the integration tests under tests/, which still call sqlx::migrate! against
# relay-core's migrations to get a throwaway DB -- Cargo's per-dependency-kind feature unification
# (resolver = "3") keeps this out of the real app build in [dependencies] above.
sqlx = { version = "0.9", features = ["macros"] }

